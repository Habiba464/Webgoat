name: DAST Security Scanning

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Start WebGoat on Port 8888
      - name: Start WebGoat Container
        run: |
          docker run -d --name webgoat -p 8888:8080 webgoat/webgoat:latest

      # Step 3: Wait until WebGoat responds
      - name: Wait for WebGoat Readiness
        run: |
          echo "Waiting for WebGoat to boot up on port 8888..."
          timeout 120s bash -c 'until curl -s http://localhost:8888/WebGoat/login > /dev/null; do sleep 5; done'
          echo "WebGoat is live on http://localhost:8888 !"

      # Step 4: Prepare Workspace Permissions
      - name: Prepare Workspace Permissions
        run: |
          sudo chmod -R 777 ${{ github.workspace }}

      # Step 5: Run OWASP ZAP Scan and force JSON/HTML output creation
      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm --network="host" \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8888/WebGoat/login \
            -r zap_report.html -J zap_report.json || true
          
          # إعطاء صلاحيات القراءة لملفات التقارير الناتجة
          sudo chmod -R 777 ${{ github.workspace }}

      # Step 6: Verify file existence & Save ZAP Reports as Artifacts
      - name: Upload ZAP Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: |
            zap_report.html
            zap_report.json
          if-no-files-found: warn
