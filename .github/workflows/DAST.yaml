name: DAST Security Scanning

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Start WebGoat on Port 8888 instead of 8080
      - name: Start WebGoat Container
        run: |
          docker run -d --name webgoat -p 8888:8080 webgoat/webgoat:latest

      # Step 3: Wait until WebGoat responds on Port 8888
      - name: Wait for WebGoat Readiness
        run: |
          echo "Waiting for WebGoat to boot up on port 8888..."
          timeout 120s bash -c 'until curl -s http://localhost:8888/WebGoat/login > /dev/null; do sleep 5; done'
          echo "WebGoat is live on http://localhost:8888 !"

     # Step 4: Run OWASP ZAP Baseline Scan (مع ضبط الصلاحيات وإخراج JSON)
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8888/WebGoat/login'
          cmd_options: '-r zap_report.html -J zap_report.json'
          allow_issue_writing: false
          fail_action: false

      # Step 5: Upload Findings to DefectDojo
      - name: Upload DAST Results to DefectDojo
        if: always()
        run: |
          if [ -f zap_report.json ]; then
            curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
              -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
              -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
              -F "scan_type=ZAP Scan" \
              -F "file=@zap_report.json" \
              -F "close_old_findings=true"
          else
            echo "zap_report.json not found, skipping upload."
          fi
      # Step 5: Save ZAP Reports as Artifacts
      - name: Upload ZAP Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: |
            zap_report.html
            zap_report.json
