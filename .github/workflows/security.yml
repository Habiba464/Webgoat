name: DevSecOps Deep Security & DefectDojo Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-scans:
    name: Run Security Scans & Import to DefectDojo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==========================================
      # STEP 1: Secret Scanning (TruffleHog)
      # ==========================================
      - name: TruffleHog Secret Scan
        run: |
          docker run --rm -v "$(pwd):/pwd" trufflesecurity/trufflehog:latest git file:///pwd --json > trufflehog-results.json || true

      # ==========================================
      # STEP 2: SAST (Semgrep)
      # ==========================================
      - name: Semgrep SAST Scan
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --json --output semgrep-results.json || true

      # ==========================================
      # STEP 3: Generate CycloneDX SBOM
      # ==========================================
      - name: Generate CycloneDX SBOM
        run: |
          chmod +x mvnw
          ./mvnw org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DschemaVersion=1.5 -Dcyclonedx.outputFormat=json || true

      # ==========================================
      # STEP 4: SCA (OWASP Dependency-Check)
      # ==========================================
      - name: OWASP Dependency-Check Scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Java App'
          path: 'target/bom.json'
          format: 'XML'
          out: 'reports'

      # ==========================================
      # STEP 5: Import All Results into DefectDojo via Direct API (curl)
      # ==========================================

      # 5.1 Import TruffleHog Secret Results
      - name: Import TruffleHog Results to DefectDojo
        if: always()
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Trufflehog Scan" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "file=@trufflehog-results.json" || true

      # 5.2 Import Semgrep SAST Results
      - name: Import Semgrep Results to DefectDojo
        if: always()
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "file=@semgrep-results.json" || true

      # 5.3 Import CycloneDX SBOM
      - name: Import SBOM to DefectDojo
        if: always()
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=CycloneDX Scan" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "file=@target/bom.json" || true

      # 5.4 Import OWASP Dependency-Check SCA Results
      - name: Import Dependency-Check Results to DefectDojo
        if: always()
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_TOKEN }}" \
            -F "scan_type=Dependency Check Scan" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "file=@reports/dependency-check-report.xml" || true

      # ==========================================
      # STEP 6: Save Artifacts in GitHub Actions
      # ==========================================
      - name: Upload Security Reports as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            trufflehog-results.json
            semgrep-results.json
            target/bom.json
            reports/dependency-check-report.xml
